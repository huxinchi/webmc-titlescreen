<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Select World to Upload</title>

<link rel="preload" as="image" href="assets/background/panorama_equirect.png">
<link rel="preload" as="image" href="assets/background/panorama_0.png">
<link rel="preload" as="image" href="assets/background/panorama_1.png">
<link rel="preload" as="image" href="assets/background/panorama_2.png">
<link rel="preload" as="image" href="assets/background/panorama_3.png">
<link rel="preload" as="image" href="assets/background/panorama_4.png">
<link rel="preload" as="image" href="assets/background/panorama_5.png">
<link rel="preload" as="audio" href="assets/sound/click.ogg">

<link rel="stylesheet" href="css/import.css">
<link rel="stylesheet" href="css/pano.css">
<script src="js/font.js"></script>

<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    color: #fff;
    font-family: 'Minecraft', monospace;
    -webkit-font-smoothing: none;
    font-smooth: never;
    position: relative;
  }

  #pano-cover { background: rgba(0, 0, 0, 0.35); }

  .rus-root {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%) scale(var(--ui-scale, 1));
    transform-origin: top center;
    width:  calc(100vw / var(--ui-scale, 1));
    height: calc(100vh / var(--ui-scale, 1));
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }
  .rus-root > * { pointer-events: auto; }

  .rus-title {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    top: 13px;
    font-size: var(--font-size, 10px);
    line-height: 9px;
    color: #ffffff;
    text-shadow: 1px 1px 0 #3f3f3f;
    user-select: none; white-space: nowrap;
    pointer-events: none;
  }

  .rus-list-wrap {
    position: absolute;
    left: 0; right: 0;
    top: 10px;
    bottom: 40px;
    overflow-y: auto;
    overflow-x: hidden;
    box-sizing: border-box;
  }

  .rus-item {
    position: relative;
    width: 280px; height: 36px;
    margin: 0 auto;
    box-sizing: border-box;
    cursor: pointer;
    user-select: none;
  }
  .rus-item.selected {
    background-color: #000000;
    box-shadow: inset 0 0 0 1px #808080;
  }
  .rus-item:hover:not(.selected) {
    background-color: rgba(255, 255, 255, 0.05);
  }

  .rus-item-name {
    position: absolute; left: 2px; top: 1px;
    font-size: var(--font-size, 10px); line-height: 9px;
    color: #FFFFFF; text-shadow: 1px 1px 0 #3f3f3f;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 270px; pointer-events: none;
  }
  .rus-item-id {
    position: absolute; left: 2px; top: 12px;
    font-size: var(--font-size, 10px); line-height: 9px;
    color: #808080; text-shadow: 1px 1px 0 #1a1a1a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 270px; pointer-events: none;
  }
  .rus-item-info {
    position: absolute; left: 2px; top: 22px;
    font-size: var(--font-size, 10px); line-height: 9px;
    color: #808080; text-shadow: 1px 1px 0 #1a1a1a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 270px; pointer-events: none;
  }
  .rus-item-info.hardcore {
    color: #AA0000;
  }

  .rus-empty {
    position: absolute;
    left: 0; right: 0;
    top: calc(50% - 20px);
    text-align: center;
    font-size: var(--font-size, 10px);
    line-height: 9px;
    color: #ffffff;
    text-shadow: 1px 1px 0 #3f3f3f;
    user-select: none;
    pointer-events: none;
    display: none;
  }
  .rus-empty.visible { display: block; }

  .rus-btn {
    position: absolute;
    bottom: 12px;
  }
  .rus-btn-upload { left: calc(50% - 154px); }
  .rus-btn-back   { left: calc(50% + 6px); }
</style>

<script src="js/exit.js"></script>
</head>
<body>

<audio id="sfx-click" src="assets/sound/click.ogg" preload="auto"></audio>

<canvas id="pano-canvas"></canvas>
<div id="pano-css"></div>
<div id="pano-cover"></div>

<div class="rus-root" id="rus-root">

  <div class="rus-title">Select World to Upload</div>

  <div class="rus-list-wrap mc-scroll" id="rus-list-wrap">
    <div class="rus-list" id="rus-list"></div>
  </div>

  <div class="rus-empty" id="rus-empty">No worlds to upload</div>

  <button class="mcbtn mcbtn-153 rus-btn rus-btn-upload" id="btn-upload" type="button" disabled>Upload</button>
  <button class="mcbtn mcbtn-153 rus-btn rus-btn-back"   id="btn-back"   type="button">Back</button>

</div>

<script src="js/main.js"></script>
<script src="js/show_background.js"></script>

<script>
(function() {
  'use strict';

  var params   = new URLSearchParams(location.search);
  var serverId = params.get('id') || '';
  var slotParam = params.get('slot') || '';

  if (!serverId) {
    try { serverId = localStorage.getItem('mc_realms_server_id') || ''; }
    catch (e) {}
  }
  if (serverId) {
    try { localStorage.setItem('mc_realms_server_id', serverId); }
    catch (e) {}
  }

  var slotId = parseInt(slotParam, 10);
  if (!(slotId >= 1 && slotId <= 3)) slotId = 0;

  /* ==========================================================
     文案
     ========================================================== */
  var TXT = {
    title:        'Select World to Upload',
    empty:        'No worlds to upload',
    upload:       'Upload',
    back:         'Back',
    conversion:   'Requires conversion',
    hardcore:     'Hardcore',
    cheats:       'Cheats',
    worldPrefix:  'World',
    gameModes:    ['Survival', 'Creative', 'Adventure', 'Spectator']
  };

  /* ==========================================================
     从单机存档 mc_worlds 加载
     ========================================================== */
  var WORLDS_KEY = 'mc_worlds';

  function parseLastPlayed(str) {
    if (!str) return Date.now();
    /* 'YYYY/MM/DD HH:MM' */
    var m = /^(\d{4})\/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})$/.exec(String(str));
    if (m) {
      return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime();
    }
    var d = new Date(str);
    if (!isNaN(d.getTime())) return d.getTime();
    return Date.now();
  }

  function inferGameMode(world) {
    if (typeof world.gameMode === 'number' && world.gameMode >= 0 && world.gameMode <= 3) {
      return world.gameMode;
    }
    var info = String(world.info || '').toLowerCase();
    if (info.indexOf('creative')   >= 0) return 1;
    if (info.indexOf('adventure')  >= 0) return 2;
    if (info.indexOf('spectator')  >= 0) return 3;
    return 0;
  }

  function inferHardcore(world) {
    if (typeof world.hardcore === 'boolean') return world.hardcore;
    return String(world.info || '').toLowerCase().indexOf('hardcore') >= 0;
  }

  function inferCheats(world) {
    if (typeof world.cheats === 'boolean') return world.cheats;
    return String(world.info || '').toLowerCase().indexOf('cheat') >= 0;
  }

  function inferConversion(world) {
    if (typeof world.requiresConversion === 'boolean') return world.requiresConversion;
    return String(world.info || '').toLowerCase().indexOf('conversion') >= 0;
  }

  function loadSaves() {
    var list = [];
    try {
      var raw = localStorage.getItem(WORLDS_KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) list = arr;
      }
    } catch (e) {}

    var result = [];
    for (var i = 0; i < list.length; i++) {
      var w = list[i];
      if (!w || typeof w !== 'object') continue;
      result.push({
        id:                 w.folder || '',
        name:               w.name || '',
        lastPlayed:         parseLastPlayed(w.lastPlayed),
        gameMode:           inferGameMode(w),
        hardcore:           inferHardcore(w),
        cheats:             inferCheats(w),
        requiresConversion: inferConversion(w)
      });
    }
    return result;
  }

  var saves = loadSaves();

  /* ==========================================================
     DOM
     ========================================================== */
  var listEl   = document.getElementById('rus-list');
  var emptyEl  = document.getElementById('rus-empty');
  var btnUp    = document.getElementById('btn-upload');
  var btnBack  = document.getElementById('btn-back');

  btnUp.textContent   = TXT.upload;
  btnBack.textContent = TXT.back;

  /* ==========================================================
     选中状态
     ========================================================== */
  var selectedIndex = -1;

  function setSelected(idx) {
    if (idx < 0 || idx >= saves.length) idx = -1;
    selectedIndex = idx;

    var items = listEl.querySelectorAll('.rus-item');
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle('selected', i === idx);
    }

    var ok = (idx >= 0 && !saves[idx].hardcore);
    btnUp.disabled = !ok;
  }

  /* ==========================================================
     渲染
     ========================================================== */
  function formatDate(ms) {
    try {
      var d = new Date(ms);
      var pad = function(n) { return (n < 10 ? '0' : '') + n; };
      return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) +
             ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    } catch (e) { return ''; }
  }

  function renderList() {
    listEl.innerHTML = '';

    if (saves.length === 0) {
      emptyEl.classList.add('visible');
      return;
    }
    emptyEl.classList.remove('visible');

    for (var i = 0; i < saves.length; i++) {
      listEl.appendChild(renderItem(saves[i], i));
    }
  }

  function renderItem(save, index) {
    var el = document.createElement('div');
    el.className = 'rus-item';
    el.dataset.index = String(index);

    var nameText = save.name && save.name.trim() ? save.name : (TXT.worldPrefix + ' ' + (index + 1));
    var nameEl = document.createElement('div');
    nameEl.className = 'rus-item-name';
    nameEl.textContent = nameText;
    el.appendChild(nameEl);

    var idEl = document.createElement('div');
    idEl.className = 'rus-item-id';
    idEl.textContent = (save.id || '') + ' (' + formatDate(save.lastPlayed) + ')';
    el.appendChild(idEl);

    var infoEl = document.createElement('div');
    infoEl.className = 'rus-item-info';

    if (save.requiresConversion) {
      infoEl.textContent = TXT.conversion;
    } else if (save.hardcore) {
      infoEl.textContent = TXT.hardcore;
      infoEl.classList.add('hardcore');
    } else {
      var parts = [TXT.gameModes[save.gameMode || 0] || ''];
      if (save.cheats) parts.push(TXT.cheats);
      infoEl.textContent = parts.join(', ');
    }
    el.appendChild(infoEl);

    el.addEventListener('click', function() { setSelected(index); });
    el.addEventListener('dblclick', function() {
      setSelected(index);
      if (!btnUp.disabled) doUpload();
    });

    return el;
  }

  /* ==========================================================
     Upload —— 跳进度页
     ========================================================== */
  function doUpload() {
    if (selectedIndex < 0) return;
    var save = saves[selectedIndex];
    if (save.hardcore) return;

    var worldName = (save.name && save.name.trim()) ? save.name : ('World ' + (selectedIndex + 1));

    var url = 'realms_upload.html?id=' + encodeURIComponent(serverId) +
              '&slot=' + (slotId || '') +
              '&name=' + encodeURIComponent(worldName) +
              '&save=' + encodeURIComponent(save.id);
    if (window.mcBack && typeof window.mcBack.jump === 'function') {
      window.mcBack.jump(url);
    } else {
      location.href = url;
    }
  }

  btnUp.addEventListener('click', function() {
    if (btnUp.disabled) return;
    doUpload();
  });

  /* ==========================================================
     Back
     ========================================================== */
  function goBack() {
    var url = 'realms_reset_world.html?id=' + encodeURIComponent(serverId) +
              '&slot=' + (slotId || '');
    if (window.mcBack && typeof window.mcBack.back === 'function') {
      window.mcBack.back(url);
    } else {
      location.href = url;
    }
  }

  btnBack.addEventListener('click', goBack);

  /* ==========================================================
     键盘：↑/↓ 移动、Enter 上传、Esc 返回
     ========================================================== */
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { e.preventDefault(); goBack(); return; }

    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      if (saves.length === 0) return;
      var next = selectedIndex < 0 ? 0 : selectedIndex + (e.key === 'ArrowUp' ? -1 : 1);
      if (next < 0) next = 0;
      if (next >= saves.length) next = saves.length - 1;
      setSelected(next);
      var item = listEl.querySelectorAll('.rus-item')[next];
      if (item && item.scrollIntoView) item.scrollIntoView({ block: 'nearest' });
      return;
    }

    if (e.key === 'Enter') {
      e.preventDefault();
      if (!btnUp.disabled) doUpload();
    }
  }, true);

  /* ==========================================================
     启动
     ========================================================== */
  renderList();
  setSelected(-1);

})();
</script>

</body>
</html>
