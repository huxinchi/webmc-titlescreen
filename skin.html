<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Skin Customization</title>

<link rel="preload" as="image" href="assets/background/panorama_equirect.png">
<link rel="preload" as="image" href="assets/background/panorama_0.png">
<link rel="preload" as="image" href="assets/background/panorama_1.png">
<link rel="preload" as="image" href="assets/background/panorama_2.png">
<link rel="preload" as="image" href="assets/background/panorama_3.png">
<link rel="preload" as="image" href="assets/background/panorama_4.png">
<link rel="preload" as="image" href="assets/background/panorama_5.png">
<link rel="preload" as="image" href="assets/background/menu_list_background.png">
<link rel="preload" as="audio" href="assets/sound/click.ogg">

<link rel="stylesheet" href="css/import.css">
<link rel="stylesheet" href="css/pano.css">

<link rel="stylesheet" href="css/options_screen.css">
<script src="js/font.js"></script>
</head>
<body>

<audio id="sfx-click" src="assets/sound/click.ogg" preload="auto"></audio>

<canvas id="pano-canvas"></canvas>
<div id="pano-css"></div>
<div id="pano-cover"></div>

<div class="options-screen">
  <div class="options-header">
    <div class="options-title" data-i18n="options.skinCustomisation.title">Skin Customization</div>
  </div>
  <div class="options-content mc-scroll" id="opts-list"></div>
  <div class="options-footer">
    <a class="mcbtn mcbtn-long btn-back" href="options.html" data-i18n="gui.done">Done</a>
  </div>
</div>

<script src="js/main.js"></script>
<script>
(function() {
  'use strict';
  var listEl = document.getElementById('opts-list');
  if (!listEl || !window.mcWidgets || !window.mcWidgets.OptionsList) return;

  var OPTIONS = {
    'options.modelPart.cape':          { type: 'boolean', value: true },
    'options.modelPart.jacket':        { type: 'boolean', value: true },
    'options.modelPart.left_sleeve':   { type: 'boolean', value: true },
    'options.modelPart.right_sleeve':  { type: 'boolean', value: true },
    'options.modelPart.left_pants_leg':{ type: 'boolean', value: true },
    'options.modelPart.right_pants_leg':{ type: 'boolean', value: true },
    'options.modelPart.hat':           { type: 'boolean', value: true },
    'options.mainHand':                { type: 'enum', values: ['left','right'], value: 'right', valueKey: 'options.mainHand.' }
  };

var ROWS = [
  ['options.modelPart.cape',           'options.modelPart.jacket'],
  ['options.modelPart.left_sleeve',    'options.modelPart.right_sleeve'],
  ['options.modelPart.left_pants_leg', 'options.modelPart.right_pants_leg'],
  ['options.modelPart.hat',            'options.mainHand']
];

  new window.mcWidgets.OptionsList(listEl, { options: OPTIONS, rows: ROWS });
})();
</script>
</body>
</html>
