<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Disconnected</title>

<link rel="preload" as="image" href="assets/background/panorama_equirect.png">
<link rel="preload" as="image" href="assets/background/panorama_0.png">
<link rel="preload" as="image" href="assets/background/panorama_1.png">
<link rel="preload" as="image" href="assets/background/panorama_2.png">
<link rel="preload" as="image" href="assets/background/panorama_3.png">
<link rel="preload" as="image" href="assets/background/panorama_4.png">
<link rel="preload" as="image" href="assets/background/panorama_5.png">
<link rel="preload" as="audio" href="assets/sound/click.ogg">

<link rel="stylesheet" href="css/import.css">
<link rel="stylesheet" href="css/pano.css">
<script src="js/font.js"></script>

<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
  }
  body {
    color: #fff;
    font-family: 'Minecraft', monospace;
    -webkit-font-smoothing: none;
    font-smooth: never;
    position: relative;
  }

  .disconnected-screen {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%) scale(var(--ui-scale, 1));
    transform-origin: top center;
    width:  calc(100vw / var(--ui-scale, 1));
    height: calc(100vh / var(--ui-scale, 1));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    z-index: 1;
    overflow: hidden;
  }

  .disconnected-box {
    width: calc(100% - 50px);
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    box-sizing: border-box;
  }

  .disconnected-title {
    font-family: 'Minecraft', monospace;
    font-size: var(--font-size, 10px);
    font-weight: bold;
    color: #ffffff;
    text-shadow: 1px 1px 0 #3f3f3f;
    text-align: center;
    user-select: none;
  }

  .disconnected-message {
    font-family: 'Minecraft', monospace;
    font-size: var(--font-size, 10px);
    color: #BABABE;
    text-shadow: 1px 1px 0 #1a1a1a;
    line-height: 1.5;
    text-align: center;
    padding: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    box-sizing: border-box;
    max-width: 100%;
  }

  .disconnected-buttons {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
</style>
</head>
<body>

<audio id="sfx-click" src="assets/sound/click.ogg" preload="auto"></audio>

<canvas id="pano-canvas"></canvas>
<div id="pano-css"></div>
<div id="pano-cover"></div>

<div class="disconnected-screen">
  <div class="disconnected-box">

    <div class="disconnected-title" id="disconnect-title"
         data-i18n="connect.failed">Failed to connect to the server</div>

    <div class="disconnected-message" id="disconnect-reason"></div>

    <div class="disconnected-buttons">
      <a class="mcbtn mcbtn-long btn-back" id="btn-back"
         href="multiplayer.html"
         data-i18n="gui.toMenu">Back to Server List</a>
    </div>

  </div>
</div>

<script src="js/main.js"></script>

<script>
(function() {
  'use strict';

  var params = new URLSearchParams(location.search);

  var titleKey  = params.get('titleKey') || 'connect.failed';
  var rawReason = params.get('reason')   || '';
  var server    = params.get('server')   || '';

  /* 未提供 reason → 构造 Java 风格连接拒绝异常 */
  if (!rawReason) {
    var addr = server || 'localhost/127.0.0.1:25565';
    if (addr.indexOf(':') < 0) addr += ':25565';
    if (addr.indexOf('/') < 0) addr = addr.replace(/^([^:]+)/, '$1/$1');

    rawReason =
      'io.netty.channel.AbstractChannel$AnnotatedConnectException: ' +
      'Connection refused: no further information: ' + addr;
  }

  var titleEl  = document.getElementById('disconnect-title');
  var reasonEl = document.getElementById('disconnect-reason');
  var backEl   = document.getElementById('btn-back');

  function t(key, fallback) {
    var v = (window.i18n && window.i18n.t) ? window.i18n.t(key) : key;
    return (v === key && fallback != null) ? fallback : v;
  }

  function apply() {
    if (titleEl)  titleEl.textContent  = t(titleKey, 'Failed to connect to the server');
    if (reasonEl) reasonEl.textContent = rawReason;
    if (backEl)   backEl.textContent   = t('gui.toMenu', 'Back to Server List');
  }

  apply();
  document.addEventListener('i18n-ready', apply, false);
})();
</script>

</body>
</html>
