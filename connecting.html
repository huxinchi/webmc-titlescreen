<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Connecting...</title>

<link rel="preload" as="image" href="assets/background/panorama_equirect.png">
<link rel="preload" as="image" href="assets/background/panorama_0.png">
<link rel="preload" as="image" href="assets/background/panorama_1.png">
<link rel="preload" as="image" href="assets/background/panorama_2.png">
<link rel="preload" as="image" href="assets/background/panorama_3.png">
<link rel="preload" as="image" href="assets/background/panorama_4.png">
<link rel="preload" as="image" href="assets/background/panorama_5.png">
<link rel="preload" as="audio" href="assets/sound/click.ogg">

<link rel="stylesheet" href="css/import.css">
<link rel="stylesheet" href="css/pano.css">
<script src="js/font.js"></script>

<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
  }
  body {
    color: #fff;
    font-family: 'Minecraft', monospace;
    -webkit-font-smoothing: none;
    font-smooth: never;
    position: relative;
  }

  .connect-screen {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%) scale(var(--ui-scale, 1));
    transform-origin: top center;
    width:  calc(100vw / var(--ui-scale, 1));
    height: calc(100vh / var(--ui-scale, 1));
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }

  .connect-status {
    position: absolute;
    left: 50%;
    top: calc(50% - 50px);
    transform: translate(-50%, -50%);
    font-family: 'Minecraft', monospace;
    font-size: var(--font-size, 10px);
    color: #ffffff;
    text-shadow: 1px 1px 0 #3f3f3f;
    text-align: center;
    user-select: none;
    white-space: nowrap;
    max-width: calc(100% - 40px);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .connect-screen #btn-cancel {
    pointer-events: auto;
    position: absolute;
    left: calc(50% - 100px);
    top: calc(25% + 132px);
    width: 200px;
    height: 20px;
  }
</style>
</head>
<body>

<audio id="sfx-click" src="assets/sound/click.ogg" preload="auto"></audio>

<canvas id="pano-canvas"></canvas>
<div id="pano-css"></div>
<div id="pano-cover"></div>

<div class="connect-screen">
  <div class="connect-status" id="connect-status"
       data-i18n="connect.connecting">Connecting to the server...</div>
  <button class="mcbtn mcbtn-long" id="btn-cancel" type="button"
          data-i18n="gui.cancel">Cancel</button>
</div>

<script src="assets/servers/presets.js"></script>
<script src="js/main.js"></script>
<script src="js/show_background.js"></script>

<script>
(function() {
  'use strict';

  /* ==========================================================
     参数
     ========================================================== */
  var params = new URLSearchParams(location.search);
  var id     = params.get('id')   || '';
  var addr   = params.get('addr') || '';

  /* i18n 缺失时的 fallback */
  var FALLBACKS = {
    'connect.connecting':  'Connecting to the server...',
    'connect.authorizing': 'Logging in...',
    'connect.encrypting':  'Encrypting...',
    'connect.negotiating': 'Negotiating...',
    'connect.joining':     'Joining world...',
    'connect.transferring':'Transferring...',
    'gui.cancel':          'Cancel'
  };

  function t(key) {
    var v = (window.i18n && window.i18n.t) ? window.i18n.t(key) : key;
    if (v === key && FALLBACKS[key] != null) return FALLBACKS[key];
    return v;
  }

  /* ==========================================================
     阶段配置
     ========================================================== */
var DEFAULT_ERROR =
  'io.netty.channel.AbstractChannel$AnnotatedConnectException: ' +
  'Connection refused: no further information: %s';

/* 无 URL 参数时的兜底 —— 与 multiplayer 的 FAIL_STAGES 保持一致 */
var DEFAULT_STAGES = [
  { key: 'connect.connecting',  duration: 800 },
  { key: 'connect.authorizing', duration: -1, error: DEFAULT_ERROR }
];

/* 归一化一个 stage 项 */
function normalizeStage(item) {
  if (!item || typeof item.key !== 'string') return null;
  var dur = Number(item.duration);
  if (!isFinite(dur)) return null;

  var err = (typeof item.error === 'string' && item.error) ? item.error : null;
  /* duration === -1 必须带 error，缺失则回落默认 */
  if (dur === -1 && !err) err = DEFAULT_ERROR;

  return { key: item.key, duration: dur, error: err };
}

/* JSON 解析（带旧格式兜底："key:duration,key:duration"） */
function decodeStages(str) {
  if (!str) return null;
  var arr = null;

  /* 1. 尝试 JSON */
  try {
    var parsed = JSON.parse(str);
    if (Array.isArray(parsed)) arr = parsed;
  } catch (e) {}

  /* 2. JSON 失败 → 旧格式兜底 */
  if (!arr && str.indexOf(',') >= 0) {
    arr = str.split(',').map(function(part) {
      var idx = part.lastIndexOf(':');
      if (idx <= 0) return null;
      return {
        key: part.substring(0, idx).trim(),
        duration: parseFloat(part.substring(idx + 1))
      };
    }).filter(Boolean);
  }

  if (!arr) return null;

  var out = [];
  arr.forEach(function(item) {
    var s = normalizeStage(item);
    if (s) out.push(s);
  });
  return out.length ? out : null;
}

var STAGES = decodeStages(params.get('stages')) || DEFAULT_STAGES;
  /* ==========================================================
     反序列化 —— 与 multiplayer.html 的 serialize 配对
     ========================================================== */
  var FN_KEY = '__fn__';

  function deserialize(obj) {
    if (Array.isArray(obj)) return obj.map(deserialize);
    if (!obj || typeof obj !== 'object') return obj;
    var out = {};
    for (var k in obj) {
      var v = obj[k];
      if (v && typeof v === 'object' && typeof v[FN_KEY] === 'string') {
        try { out[k] = new Function('return (' + v[FN_KEY] + ')')(); }
        catch (e) { console.warn('[connecting] revive fn failed:', k, e); }
      } else if (v && typeof v === 'object') {
        out[k] = deserialize(v);
      } else {
        out[k] = v;
      }
    }
    return out;
  }

  /* ==========================================================
     地址归一化
     ========================================================== */
  function normAddr(a) {
    a = String(a || '').trim().toLowerCase();
    if (!a) return '';
    if (a.indexOf(':') < 0) a += ':25565';
    return a;
  }

  /* ==========================================================
     找 join 目标
       1. presets 按 addr 命中
       2. mc_servers 里按 id 或按 addr 搜（含 LAN）
       3. 都没有 → null
     ========================================================== */
  function resolveJoinTarget() {
    var a1 = normAddr(addr);

    /* 1. presets 优先 */
    if (addr && window.mcMatchPreset) {
      var m = window.mcMatchPreset(addr);
      if (m && m.preset && typeof m.preset.onJoin === 'function') {
        return m.preset;
      }
    }

    /* 2. mc_servers 里搜 */
    try {
      var raw = localStorage.getItem('mc_servers');
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) {
          var byId   = null;
          var byAddr = null;

          for (var i = 0; i < arr.length; i++) {
            var e = arr[i];
            if (!e) continue;

            if (!byId && id && e.id === id) {
              byId = e;
            }
            if (!byAddr && a1) {
              var ea = normAddr(e.ip || e.address || e.name || '');
              if (ea && ea === a1) byAddr = e;
            }
            if (byId && byAddr) break;
          }

          var picked = byId || byAddr;
          if (picked) {
            var s = deserialize(picked);

            /* 兜底：拿到条目后若地址还能命中 preset → 用 preset */
            var a2 = s.ip || s.address || s.name || '';
            if (a2 && window.mcMatchPreset) {
              var m2 = window.mcMatchPreset(a2);
              if (m2 && m2.preset && typeof m2.preset.onJoin === 'function') {
                return m2.preset;
              }
            }

            if (typeof s.onJoin === 'function') return s;
          }
        }
      }
    } catch (e) {}

    return null;
  }

  /* ==========================================================
     DOM
     ========================================================== */
  var statusEl = document.getElementById('connect-status');
  var cancelEl = document.getElementById('btn-cancel');

  var currentKey = STAGES.length ? STAGES[0].key : 'connect.connecting';

  function applyStatus() {
    statusEl.textContent = t(currentKey);
  }
  applyStatus();
  document.addEventListener('i18n-ready', applyStatus, false);

  /* ==========================================================
     状态机
     ========================================================== */
  var stageTimer = null;
  var stageIndex = 0;
  var aborted    = false;

function advanceStage() {
  if (aborted) return;

  if (stageIndex >= STAGES.length) {
    finish();
    return;
  }

  var stage = STAGES[stageIndex];
  stageIndex++;

  currentKey = stage.key;
  applyStatus();

  /* duration === -1 → 立即中断，跳断连页 */
  if (stage.duration === -1) {
    abortWithError(stage.error || DEFAULT_ERROR);
    return;
  }

  stageTimer = setTimeout(advanceStage, stage.duration);
}

/* 把 error 里的 %s 替换成 addr（缺失则用原始 error） */
function expandError(err, addr) {
  if (!err) return '';
  var target = addr || 'localhost:25565';
  return err.indexOf('%s') >= 0 ? err.replace('%s', target) : err;
}

/* 中断：跳 disconnected，带 reason */
/* 中断：跳 disconnected，带 reason
   ★ 用 jumpNoPush —— 不把 connecting 压进栈，
     否则 disconnected 的 Back 会弹回 connecting */
function abortWithError(err) {
  if (aborted) return;
  aborted = true;
  if (stageTimer) clearTimeout(stageTimer);

  var reason = expandError(err, addr);
  var url = 'disconnected.html?server=' + encodeURIComponent(addr || 'localhost:25565')
          + '&reason=' + encodeURIComponent(reason);

  if (window.mcBack && typeof window.mcBack.jumpNoPush === 'function') {
    window.mcBack.jumpNoPush(url);
  } else if (window.mcBack && typeof window.mcBack.jump === 'function') {
    window.mcBack.jump(url);
  } else {
    location.href = url;
  }
}

function finish() {
  if (aborted) return;

  var target = resolveJoinTarget();

  if (!target) {
    abortWithError(DEFAULT_ERROR);
    return;
  }

  /* 多人进服务器：连接成功后直接调 onJoin
     （原版这里进游戏 + LoadingOverlay，网页版对应 onJoin 的 alert / 跳转） */
  try {
    target.onJoin.call(target);
  } catch (e) {
    console.error('[connecting] onJoin', e);
  }

  /* onJoin 一般会弹 alert 或跳走；
     如果它什么都没做，500ms 后自动回 multiplayer */
  setTimeout(function() {
    if (!aborted) goBack();
  }, 500);
}
  /* ==========================================================
     取消 / 回落
     ========================================================== */
  function cancel() {
    if (aborted) return;
    aborted = true;
    if (stageTimer) clearTimeout(stageTimer);
    goBack();
  }

  function goBack() {
    if (window.mcBack && typeof window.mcBack.back === 'function') {
      window.mcBack.back('multiplayer.html');
    } else {
      location.href = 'multiplayer.html';
    }
  }



  cancelEl.addEventListener('click', function(e) {
    e.preventDefault();
    cancel();
  });

  /* shouldCloseOnEsc() = false */
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') e.preventDefault();
  }, true);

  /* ==========================================================
     启动
     ========================================================== */
  advanceStage();

})();
</script>

</body>
</html>
