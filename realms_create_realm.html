<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Create a new Realm</title>

<link rel="preload" as="image" href="assets/background/panorama_equirect.png">
<link rel="preload" as="image" href="assets/background/panorama_0.png">
<link rel="preload" as="image" href="assets/background/panorama_1.png">
<link rel="preload" as="image" href="assets/background/panorama_2.png">
<link rel="preload" as="image" href="assets/background/panorama_3.png">
<link rel="preload" as="image" href="assets/background/panorama_4.png">
<link rel="preload" as="image" href="assets/background/panorama_5.png">
<link rel="preload" as="audio" href="assets/sound/click.ogg">

<link rel="stylesheet" href="css/import.css">
<link rel="stylesheet" href="css/pano.css">
<script src="js/font.js"></script>

<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    color: #fff;
    font-family: 'Minecraft', monospace;
    -webkit-font-smoothing: none;
    font-smooth: never;
    position: relative;
  }

  #pano-cover { background: rgba(0, 0, 0, 0.35); }

  .crr-root {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%) scale(var(--ui-scale, 1));
    transform-origin: top center;
    width:  calc(100vw / var(--ui-scale, 1));
    height: calc(100vh / var(--ui-scale, 1));
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }
  .crr-root > * { pointer-events: auto; }

  .crr-title {
    position: absolute;
    left: 0; right: 0;
    top: 11px;
    text-align: center;
    font-size: var(--font-size, 10px);
    line-height: 9px;
    color: #ffffff;
    text-shadow: 1px 1px 0 #3f3f3f;
    user-select: none;
    pointer-events: none;
  }

  .crr-label {
    position: absolute;
    left: calc(50% - 100px);
    font-size: var(--font-size, 10px);
    line-height: 9px;
    color: #A0A0A0;
    text-shadow: 1px 1px 0 #1a1a1a;
    user-select: none;
    white-space: nowrap;
    pointer-events: none;
  }
  .crr-label-name { top: 52px; }
  .crr-label-desc { top: 102px; }

  .crr-input-wrap {
    position: absolute;
    left: calc(50% - 100px);
    width: 200px;
    height: 20px;
  }
  #crr-name-wrap { top: 65px; }
  #crr-desc-wrap { top: 115px; }

  .crr-input-wrap .mc-input {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    font-size: var(--font-size, 10px);
  }

  .crr-btn {
    position: absolute;
  }
  .crr-btn-create {
    left: calc(50% - 100px);
  }
  .crr-btn-cancel {
    left: calc(50% + 5px);
  }
</style>

<script src="js/exit.js"></script>
</head>
<body>

<audio id="sfx-click" src="assets/sound/click.ogg" preload="auto"></audio>

<canvas id="pano-canvas"></canvas>
<div id="pano-css"></div>
<div id="pano-cover"></div>

<div class="crr-root" id="crr-root">

  <div class="crr-title">Create a new Realm</div>

  <div class="crr-label crr-label-name">Realm name</div>
  <div class="crr-input-wrap" id="crr-name-wrap">
    <input class="mc-input" id="crr-name" type="text" autocomplete="off">
  </div>

  <div class="crr-label crr-label-desc">Realm description</div>
  <div class="crr-input-wrap" id="crr-desc-wrap">
    <input class="mc-input" id="crr-desc" type="text" autocomplete="off">
  </div>

  <button class="mcbtn mcbtn-97 crr-btn crr-btn-create" id="btn-create" type="button" disabled>Create</button>
  <button class="mcbtn mcbtn-95 crr-btn crr-btn-cancel" id="btn-cancel" type="button">Cancel</button>

</div>

<script src="js/main.js"></script>
<script src="js/show_background.js"></script>

<script>
(function() {
  'use strict';

  var STORAGE_KEY = 'mc_realms';
  var FN_KEY      = '__fn__';

  /* ==========================================================
     文案（Realms 无 i18n）
     ========================================================== */
  var TXT = {
    title:   'Create a new Realm',
    nameLbl: 'Realm name',
    descLbl: 'Realm description',
    create:  'Create',
    cancel:  'Cancel'
  };

  /* ==========================================================
     Cookie 工具
     ========================================================== */
  function getCookie(name) {
    var m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return m ? decodeURIComponent(m[2]) : '';
  }
  function setCookie(name, value, days) {
    var d = new Date();
    d.setTime(d.getTime() + (days || 365) * 86400000);
    document.cookie = name + '=' + encodeURIComponent(value) + ';expires=' + d.toUTCString() + ';path=/';
  }
  function delCookie(name) {
    document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
  }

  /* ==========================================================
     序列化 / 反序列化
     ========================================================== */
  function serialize(obj) {
    if (Array.isArray(obj)) return obj.map(serialize);
    if (!obj || typeof obj !== 'object') return obj;
    var out = {};
    for (var k in obj) {
      if (k.charAt(0) === '_') continue;
      var v = obj[k];
      if (typeof v === 'function') {
        out[k] = {}; out[k][FN_KEY] = v.toString();
      } else if (v && typeof v === 'object') {
        out[k] = serialize(v);
      } else {
        out[k] = v;
      }
    }
    return out;
  }

  function deserialize(obj) {
    if (Array.isArray(obj)) return obj.map(deserialize);
    if (!obj || typeof obj !== 'object') return obj;
    var out = {};
    for (var k in obj) {
      var v = obj[k];
      if (v && typeof v === 'object' && typeof v[FN_KEY] === 'string') {
        try { out[k] = new Function('return (' + v[FN_KEY] + ')')(); }
        catch (e) {}
      } else if (v && typeof v === 'object') {
        out[k] = deserialize(v);
      } else {
        out[k] = v;
      }
    }
    return out;
  }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return deserialize(JSON.parse(raw));
    } catch (e) { return null; }
  }

  function saveData(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(serialize(data))); } catch (e) {}
  }

  /* ==========================================================
     同步 cookie 到主菜单
     ========================================================== */
  function syncCookiesToMainMenu(data) {
    if (data.pendingInvites > 0) {
      setCookie('realms_invite', '1');
    } else {
      if (getCookie('realms_invite') !== '') {
        setCookie('realms_invite', '0');
      }
    }

    if (data.hasUnreadNews) {
      setCookie('realms_news', '1');
    } else {
      if (getCookie('realms_news') !== '') {
        delCookie('realms_news');
      }
    }

    if (data.trialAvailable && !data.createdTrial) {
      setCookie('realms_trial', '1');
    } else {
      if (getCookie('realms_trial') !== '') {
        delCookie('realms_trial');
      }
    }
  }

  /* ==========================================================
     DOM
     ========================================================== */
  var rootEl    = document.getElementById('crr-root');
  var nameInput = document.getElementById('crr-name');
  var descInput = document.getElementById('crr-desc');
  var btnCreate = document.getElementById('btn-create');
  var btnCancel = document.getElementById('btn-cancel');

  /* ==========================================================
     校验
     ========================================================== */
  function valid() {
    return nameInput.value != null && nameInput.value.trim().length > 0;
  }
  function refreshCreateState() {
    btnCreate.disabled = !valid();
  }
  nameInput.addEventListener('input', refreshCreateState);
  descInput.addEventListener('input', refreshCreateState);

  /* ==========================================================
     布局：按钮 y = height/4 + 120 + 17
     ========================================================== */
  function layoutFooter() {
    var h = rootEl.clientHeight || window.innerHeight;
    var y = Math.floor(h / 4) + 120 + 17;
    btnCreate.style.top = y + 'px';
    btnCancel.style.top = y + 'px';
  }
  layoutFooter();
  window.addEventListener('resize', layoutFooter);

  /* ==========================================================
     创建
     ========================================================== */
  function createRealm() {
    if (!valid()) return;

    var name = nameInput.value.trim();
    var desc = descInput.value.trim();

    var data = loadData();
    if (!data || typeof data !== 'object') {
      data = {
        trialAvailable: false,
        createdTrial:   false,
        hasUnreadNews:  false,
        newsLink:       '',
        pendingInvites: 0,
        ownUUID:        'self-uuid',
        servers:        []
      };
    }
    if (!Array.isArray(data.servers)) data.servers = [];

    var newServer = {
      id:          'realm_' + Date.now(),
      name:        name,
      description: desc,
      ownerUUID:   data.ownUUID || 'self-uuid',
      state:       'closed',
      expired:     false,
      daysLeft:    30,
      players:     { online: 0, max: 10 },
      activeSlot:  1,
      slots: {
        1: { empty: true, name: 'World 1' },
        2: { empty: true, name: 'World 2' },
        3: { empty: true, name: 'World 3' }
      }
    };

    data.servers.push(newServer);

    saveData(data);
    syncCookiesToMainMenu(data);

    try { localStorage.setItem('mc_realms_server_id', newServer.id); } catch (e) {}

    if (window.mcBack && typeof window.mcBack.back === 'function') {
      window.mcBack.back('realms.html');
    } else {
      location.replace('realms.html');
    }
  }

  btnCreate.addEventListener('click', function() {
    if (btnCreate.disabled) return;
    createRealm();
  });

  /* ==========================================================
     取消 / Esc
     ========================================================== */
  function goBack() {
    if (window.mcBack && typeof window.mcBack.back === 'function') {
      window.mcBack.back('realms.html');
    } else {
      location.replace('realms.html');
    }
  }

  btnCancel.addEventListener('click', goBack);

  /* ==========================================================
     键盘
     ========================================================== */
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!btnCreate.disabled) createRealm();
      return;
    }

    if (e.key === 'Escape') {
      e.preventDefault();
      goBack();
      return;
    }

    if (e.key === 'Tab') {
      e.preventDefault();
      if (document.activeElement === nameInput) descInput.focus();
      else nameInput.focus();
    }
  }, true);

  /* ==========================================================
     启动
     ========================================================== */
  refreshCreateState();
  try { nameInput.focus(); } catch (e) {}

})();
</script>

</body>
</html>
