<link rel="preload" as="image" href="assets/background/panorama_4.png">

<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    color: #fff;
    font-family: 'Minecraft', monospace;
    -webkit-font-smoothing: none;
    font-smooth: never;
    position: relative;
  }

  .server-screen {
    position: fixed; top: 0; left: 50%;
    transform: translateX(-50%) scale(var(--ui-scale, 1));
    transform-origin: top center;
    width:  calc(100vw / var(--ui-scale, 1));
    height: calc(100vh / var(--ui-scale, 1));
    display: flex; flex-direction: column; z-index: 1; overflow: hidden;
  }
  .server-header {
    flex: 0 0 33px; display: flex; align-items: center;
    justify-content: center; box-sizing: border-box;
  }
  .server-title {
    font-family: 'Minecraft', monospace;
    font-size: var(--font-size, 10px);
    line-height: 1; color: #ffffff;
    text-shadow: 1px 1px 0 #3f3f3f;
    white-space: nowrap; user-select: none;
  }
  .server-content {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overflow-x: hidden; padding: 2px 0;
    background-image: url('assets/background/menu_list_background.png');
    background-repeat: repeat; background-size: 32px 32px;
    image-rendering: pixelated;
  }
  .server-footer {
    flex: 0 0 60px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    box-sizing: border-box;
  }
  .server-footer-row { display: flex; gap: 4px; justify-content: center; }
  #pano-cover { background: rgba(0, 0, 0, 0.35); }
</style>

<script src="js/exit.js"></script>
</head>
<body>

<audio id="sfx-click" src="assets/sound/click.ogg" preload="auto"></audio>

<canvas id="pano-canvas"></canvas>
<div id="pano-css"></div>
<div id="pano-cover"></div>

<div class="server-screen">

  <div class="server-header">
    <div class="server-title" data-i18n="multiplayer.title">Play Multiplayer</div>
  </div>

  <div class="server-content mc-scroll" id="server-list"></div>

  <div class="server-footer">
    <div class="server-footer-row">
      <button class="mcbtn mcbtn-half" id="btn-select" disabled data-i18n="selectServer.select">Join Server</button>
      <a class="mcbtn mcbtn-half" id="btn-direct" href="direct_join.html"
         data-i18n="selectServer.direct">Direct Connection</a>
      <a class="mcbtn mcbtn-half" id="btn-add" href="manage_server.html?mode=add"
         data-i18n="selectServer.add">Add Server</a>
    </div>
    <div class="server-footer-row">
      <button class="mcbtn mcbtn-71" id="btn-edit"    disabled data-i18n="selectServer.edit">Edit</button>
      <button class="mcbtn mcbtn-71" id="btn-delete"  disabled data-i18n="selectServer.delete">Delete</button>
      <button class="mcbtn mcbtn-71" id="btn-refresh"          data-i18n="selectServer.refresh">Refresh</button>
      <a class="mcbtn mcbtn-71 btn-back" href="index.html" data-i18n="gui.back">Back</a>
    </div>
  </div>

</div>

<script src="assets/servers/presets.js"></script>
<script src="js/main.js"></script>
<script src="js/server_select.js"></script>
<script src="js/show_background.js"></script>

<script>
(function() {
  'use strict';
function t(key, fallback) {
  var v = (window.i18n && window.i18n.t) ? window.i18n.t(key) : key;
  if (v === key && fallback != null) return fallback;
  return v;
}
  var STORAGE_KEY     = 'mc_servers';
  var STORAGE_VERSION = 8;
  var VERSION_KEY     = 'mc_servers_version';
  var FN_KEY          = '__fn__';

  /* LAN 世界重现延迟上限（毫秒） */
  var LAN_REJOIN_MAX_MS = 1800;

  /* ==========================================================
     连接阶段默认时长（毫秒），可被 server.stages 覆盖
     ========================================================== */
 /* ==========================================================
   连接阶段默认配置
   - duration >= 0 → 正常等待
   - duration === -1 → 立即失败，用 error 作为断连原因
     （必须配 error；缺失则回落 DEFAULT_ERROR）
   - error 里若含 %s，connecting.html 会替换成服务器地址
   ========================================================== */
var DEFAULT_ERROR =
  'io.netty.channel.AbstractChannel$AnnotatedConnectException: ' +
  'Connection refused: no further information: %s';

/* 有 onJoin → 走完整时序 */
var NORMAL_STAGES = [
  { key: 'connect.connecting',  duration: 800 },
  { key: 'connect.authorizing', duration: 600 },
  { key: 'connect.encrypting',  duration: 400 },
  { key: 'connect.joining',     duration: 600 }
];

/* 无 onJoin → 立即在 connecting 阶段失败 */
/* 无 onJoin → connecting 停留一段后，进入 authorizing 时立即失败 */
var FAIL_STAGES = [
  { key: 'connect.connecting',  duration: 800 },
  { key: 'connect.authorizing', duration: -1, error: DEFAULT_ERROR }
];

function getStagesFor(server) {
  /* 1. 显式 stages 优先 */
  if (server && Array.isArray(server.stages) && server.stages.length) {
    return server.stages;
  }
  /* 2. 有 onJoin → 正常时序 */
  if (server && typeof server.onJoin === 'function') {
    return NORMAL_STAGES;
  }
  /* 3. 无 onJoin → 立即失败 */
  return FAIL_STAGES;
}
/* JSON 编码：会带上 error 字段，URLSearchParams 会再包一层 encodeURIComponent */
function encodeStages(stages) {
  return JSON.stringify(stages);
}

  /* ==========================================================
     普通服务器 —— 存 localStorage，可增删改
     ========================================================== */
  var DEFAULT_SERVERS = [
    {
      id:   'testserver',
      name: 'Test Server',
      ip:   'test.example.com',
      icon: null,
      motd: '§aTest server for §bhandle §ftesting',
      players: { online: 3, max: 20 },
      playerList: ['Steve', 'Alex', 'Notch'],
      ping: 42,
      version: '1.21',
      status: 'successful',
      type: 'other',

      onUpdate: function() {
        var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_';
        var count = 1 + Math.floor(Math.random() * 5);
        var players = [];
        for (var i = 0; i < count; i++) {
          var s = '';
          for (var j = 0; j < 5; j++) {
            s += chars.charAt(Math.floor(Math.random() * chars.length));
          }
          players.push(s);
        }
        this.players = { online: players.length, max: 20 };
        this.playerList = players;
        this.ping = Math.floor(Math.random() * 1000) + 10;
      },

      onJoin:   function() { alert('join ' + this.name); },
      onDelete: function() { alert('delete ' + this.name); }
    }
  ];

  /* ==========================================================
     LAN 候选池 —— 现在也持久化进 mc_servers（type: 'lan'）
     - id 用于去重 / 编辑定位
     - type: 'lan' 用于渲染时与普通服务器区分
     ========================================================== */
  var LAN_SERVERS = [
    {
      id:      'lan_192.168.1.10',
      type:    'lan',
      address: '192.168.1.10:25565',
      motd:    '§eA local world',
      onJoin:  function() { alert('join LAN World'); }
    },
    {
      id:      'lan_192.168.1.42',
      type:    'lan',
      address: '192.168.1.42:25565',
      motd:    '§7Another local world'
      /* 无 onJoin —— 出现时也是不可连接的（走断连页） */
    }
  ];

  /* 当前可见的 LAN id 集合 */
  var lanVisibleIds = {};
  var lanTimers     = [];

  /* ==========================================================
     应用 preset —— 地址命中就覆盖动态字段
     - 保留本地 id / name（用户自定义不被覆盖）
     - 未命中 → 清掉可能残留的动态字段
     - LAN 条目不走 preset（它们有自己的 onJoin / motd）
     ========================================================== */
  function applyPresetToServer(s) {
    if (!s || s.type === 'lan' || s._isLan) return false;

    var addr = s.ip || s.address || s.name || '';
    var m = window.mcMatchPreset ? window.mcMatchPreset(addr) : null;

if (!m || !m.preset) {
  delete s.onJoin;
  delete s.onEdit;
  delete s.onDelete;
  delete s.motd;
  delete s.players;
  delete s.playerList;
  delete s.ping;
  delete s.version;
  delete s.stages;              /* ★ 清掉旧 stages，回落到默认 */
  s.type = s.type || 'other';
  return false;
}

    var p = m.preset;

    s.onJoin   = p.onJoin;
    s.onEdit   = p.onEdit;
    s.onDelete = p.onDelete;
    s.motd       = p.motd;
    s.players    = p.players;
    s.playerList = p.playerList;
    s.ping       = p.ping;
    s.version    = p.version;
  s.type       = p.type || 'other';
  if (p.icon != null) s.icon = p.icon;

  /* ★ preset 若带 stages → 覆盖；不带则用默认 */
  if (p.stages && p.stages.length) {
    s.stages = p.stages;
  } else {
    delete s.stages;
  }

  return true;
}
  

  /* ==========================================================
     序列化 / 反序列化（支持函数）
     ========================================================== */
  function serialize(obj) {
    if (Array.isArray(obj)) return obj.map(serialize);
    if (!obj || typeof obj !== 'object') return obj;
    var out = {};
    for (var k in obj) {
      if (k.charAt(0) === '_') continue;
      if (k === 'status') continue;
      var v = obj[k];
      if (typeof v === 'function') {
        out[k] = {};
        out[k][FN_KEY] = v.toString();
      } else if (v && typeof v === 'object') {
        out[k] = serialize(v);
      } else {
        out[k] = v;
      }
    }
    return out;
  }

  function deserialize(obj) {
    if (Array.isArray(obj)) return obj.map(deserialize);
    if (!obj || typeof obj !== 'object') return obj;
    var out = {};
    for (var k in obj) {
      var v = obj[k];
      if (v && typeof v === 'object' && typeof v[FN_KEY] === 'string') {
        try { out[k] = new Function('return (' + v[FN_KEY] + ')')(); }
        catch (e) { console.warn('[multiplayer] revive fn failed:', k, e); }
      } else if (v && typeof v === 'object') {
        out[k] = deserialize(v);
      } else {
        out[k] = v;
      }
    }
    out.status = 'successful';
    return out;
  }

  /* ==========================================================
     把 LAN 定义重新合并进 SERVERS
     - 移除旧 LAN（避免持久化数据污染）
     - 从 LAN_SERVERS 定义里重新加入（始终用最新定义）
     ========================================================== */
  function mergeLanInto(list) {
    var out = list.filter(function(s) { return s && s.type !== 'lan'; });
    LAN_SERVERS.forEach(function(lan) { out.push(lan); });
    return out;
  }

  /* ==========================================================
     loadServers
     - 读 localStorage 后：应用 preset + 合并 LAN 定义
     ========================================================== */
  function loadServers() {
    try {
      var oldVer = parseInt(localStorage.getItem(VERSION_KEY) || '0', 10);
      if (oldVer !== STORAGE_VERSION) {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.setItem(VERSION_KEY, String(STORAGE_VERSION));
      }
    } catch (e) {}

    var list = null;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) {
          list = deserialize(arr);
          list.forEach(function(s) {
            s.status = 'successful';
            applyPresetToServer(s);
          });
        }
      }
    } catch (e) {}

    if (!list) {
      list = DEFAULT_SERVERS.slice();
      list.forEach(function(s) { applyPresetToServer(s); });
    }

    return mergeLanInto(list);
  }

  function saveServers(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(serialize(list)));
    } catch (e) {}
  }

  /* ==========================================================
     是否可连 —— 只看 onJoin
     ========================================================== */
  function hasJoinHandle(s) {
    return typeof s.onJoin === 'function';
  }

  var SERVERS = loadServers();

  /* 首次加载后就把合并结果写回 localStorage */
  saveServers(SERVERS);

  /* ==========================================================
     视图筛选
     ========================================================== */
  function getNormalServers() {
    return SERVERS.filter(function(s) { return s && s.type !== 'lan'; });
  }

  function getVisibleLanServers() {
    return SERVERS.filter(function(s) {
      return s && s.type === 'lan' && lanVisibleIds[s.id];
    });
  }

  /* ==========================================================
     DOM
     ========================================================== */
  var listEl     = document.getElementById('server-list');
  var btnSelect  = document.getElementById('btn-select');
  var btnDirect  = document.getElementById('btn-direct');
  var btnAdd     = document.getElementById('btn-add');
  var btnEdit    = document.getElementById('btn-edit');
  var btnDelete  = document.getElementById('btn-delete');
  var btnRefresh = document.getElementById('btn-refresh');

  /* ==========================================================
     列表实例
     ========================================================== */
  var list = new window.mcWidgets.ServerSelectionList(listEl, {
    onSelect: updateButtonState,

    onJoin: function(server) {
      joinServerFromList(server);
    },

    /* 排序只对普通服务器生效 */
    onMoveUp: function(server, index) {
      if (index <= 0) return;
      var normals = getNormalServers();
      var tmp = normals[index - 1];
      normals[index - 1] = normals[index];
      normals[index] = tmp;

      var lans = SERVERS.filter(function(s) { return s.type === 'lan'; });
      SERVERS.length = 0;
      normals.forEach(function(s) { SERVERS.push(s); });
      lans.forEach(function(s) { SERVERS.push(s); });

      saveServers(SERVERS);
      refreshListUI();
    },

    onMoveDown: function(server, index) {
      var normals = getNormalServers();
      if (index >= normals.length - 1) return;

      var tmp = normals[index + 1];
      normals[index + 1] = normals[index];
      normals[index] = tmp;

      var lans = SERVERS.filter(function(s) { return s.type === 'lan'; });
      SERVERS.length = 0;
      normals.forEach(function(s) { SERVERS.push(s); });
      lans.forEach(function(s) { SERVERS.push(s); });

      saveServers(SERVERS);
      refreshListUI();
    }
  });

  /* ==========================================================
     统一渲染入口
     ========================================================== */
  function refreshListUI() {
    list.setServers(getNormalServers());
    list.setLanServers(getVisibleLanServers());
  }

  /* ==========================================================
     刷新 LAN —— 清空 + 各自随机 0~LAN_REJOIN_MAX_MS 后重现
     ========================================================== */
  function refreshLanServers() {
    lanTimers.forEach(function(id) { clearTimeout(id); });
    lanTimers = [];

    lanVisibleIds = {};
    list.setLanServers([]);

    var sel = list.getSelected();
    if (sel && sel.type === 'lan') {
      list.clearSelected();
      updateButtonState(null);
    }

    SERVERS.forEach(function(s) {
      if (s.type !== 'lan') return;
      var delay = Math.floor(Math.random() * LAN_REJOIN_MAX_MS);
      var tid = setTimeout(function() {
        lanVisibleIds[s.id] = true;
        list.setLanServers(getVisibleLanServers());
      }, delay);
      lanTimers.push(tid);
    });
  }

  /* ==========================================================
     连接服务器
       1. 无 handle（既无 preset 也无 onJoin）→ 断连页
       2. 有 handle → 连接页走状态机
     ========================================================== */
  function joinServerFromList(sel) {
    if (!sel) return;
    if (sel._isLanHeader) return;

    var addr = sel.ip || sel.address || sel.name || '';

    var m = window.mcMatchPreset ? window.mcMatchPreset(addr) : null;
    var hasPreset = !!(m && typeof m.preset.onJoin === 'function');
    var hasLocal  = typeof sel.onJoin === 'function';

    if (!hasPreset && !hasLocal) {
      showDisconnected(addr);
      return;
    }

    showConnecting(sel, addr);
  }

  /* ==========================================================
     跳转连接页 —— 阶段配置字符串化后走参数
     ========================================================== */
  function showConnecting(sel, addr) {
    var qs = [];
    if (sel.id) qs.push('id='   + encodeURIComponent(sel.id));
    if (addr)   qs.push('addr=' + encodeURIComponent(addr));

    var stages = getStagesFor(sel);
    qs.push('stages=' + encodeURIComponent(encodeStages(stages)));

    var url = 'connecting.html' + (qs.length ? '?' + qs.join('&') : '');
    if (window.mcBack && typeof window.mcBack.jump === 'function') {
      window.mcBack.jump(url);
    } else {
      location.href = url;
    }
  }

  /* ==========================================================
     跳转连接断开页
     ========================================================== */
  function showDisconnected(addr, customReason) {
    var url = 'disconnected.html?server=' + encodeURIComponent(addr || 'localhost:25565');
    if (customReason) {
      url += '&reason=' + encodeURIComponent(customReason);
    }

    if (window.mcBack && typeof window.mcBack.jump === 'function') {
      window.mcBack.jump(url);
    } else {
      location.href = url;
    }
  }

  /* ==========================================================
     按钮状态
     ========================================================== */
  function updateButtonState(server) {
    var isLanHeader = !!server && server._isLanHeader;
    var isLanEntry  = !!server && server.type === 'lan';
    var editable    = !!server && !isLanHeader && !isLanEntry;

    btnSelect.disabled = !server || isLanHeader;
    btnEdit.disabled   = !editable;
    btnDelete.disabled = !editable;
  }
  updateButtonState(null);

  /* ==========================================================
     Handle 分发
     ========================================================== */
  function dispatch(server, action) {
    if (!server) return;
    var fn = server[action];
    if (typeof fn === 'function') {
      try { fn.call(server); } catch (e) { console.error('[multiplayer]', action, e); }
    }
  }

  btnSelect.addEventListener('click', function() {
    joinServerFromList(list.getSelected());
  });

  btnEdit.addEventListener('click', function() {
    var sel = list.getSelected();
    if (!sel || sel._isLanHeader || sel.type === 'lan') return;

    if (typeof sel.onEdit === 'function') {
      try { sel.onEdit.call(sel); return; } catch (e) { console.error('[multiplayer] onEdit', e); }
    }

    var target = 'manage_server.html?mode=edit&id=' + encodeURIComponent(sel.id || '');
    if (window.mcBack && typeof window.mcBack.jump === 'function') {
      window.mcBack.jump(target);
    } else {
      location.href = target;
    }
  });

  /* Delete —— 无 onDelete 就走确认页 */
  btnDelete.addEventListener('click', function() {
var sel = list.getSelected();
if (!sel || sel._isLanHeader || sel.type === 'lan') return;

/* 不再提前走 handle —— 统一先跳 confirm 页 */
var serverName = sel.name || sel.ip || sel.address || '';
  var warnTpl = t('selectServer.deleteWarning', "'%s' will be lost forever! (A long time!)");
  var warnMsg = warnTpl.indexOf('%s') >= 0 ? warnTpl.replace('%s', serverName) : warnTpl;

  try {
    localStorage.setItem('mc_confirm_action', JSON.stringify({
      type: 'deleteServer',
      data: { id: sel.id }
    }));
  } catch (e) {}

  var url = 'delete_server.html'
    + '?title='   + encodeURIComponent(t('selectServer.deleteQuestion', 'Are you sure you want to remove this server?'))
    + '&message=' + encodeURIComponent(warnMsg)
    + '&yes='     + encodeURIComponent(t('selectServer.deleteButton', t('gui.yes', 'Yes')))
    + '&no='      + encodeURIComponent(t('gui.cancel', t('gui.no', 'No')));

  if (window.mcBack && typeof window.mcBack.jump === 'function') {
    window.mcBack.jump(url);
  } else {
    location.href = url;
  }
});

  /* ==========================================================
     i18n 就绪后重新渲染
     ========================================================== */
  if (window.i18n && window.i18n.ready) {
    window.i18n.ready(function() { refreshListUI(); });
  }
  document.addEventListener('i18n-ready', function() { refreshListUI(); }, false);

  /* ==========================================================
     Refresh / F5
     ========================================================== */
  var refreshTimer = null;

  function refreshServerList(force) {
    if (refreshTimer && !force) return;

    if (refreshTimer) {
      clearTimeout(refreshTimer);
      refreshTimer = null;
      SERVERS.forEach(function(s) {
        if (s._origStatus) { s.status = s._origStatus; delete s._origStatus; }
      });
    }

    SERVERS.forEach(function(s) {
      if (s.type === 'lan') return;
      s._origStatus = s.status || 'successful';
      s.status = 'pinging';
    });
    refreshListUI();

    refreshLanServers();

    refreshTimer = setTimeout(function() {
      SERVERS.forEach(function(s) {
        if (s.type === 'lan') return;

        var applied = applyPresetToServer(s);
        if (!applied && typeof s.onUpdate === 'function') {
          try { s.onUpdate.call(s); } catch (e) { console.error('[server] onUpdate', e); }
        }
        s.status = hasJoinHandle(s) ? 'successful' : 'unreachable';
        delete s._origStatus;
      });

      saveServers(SERVERS);
      refreshListUI();
      refreshTimer = null;
    }, 1000);
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'F5') {
      e.preventDefault();
      refreshServerList(true);
    }
  }, true);

  btnRefresh.addEventListener('click', function() {
    refreshServerList(true);
  });

  /* ==========================================================
     对外 API
     ========================================================== */
  window.mcMultiplayer = {
    getServers:     function() { return getNormalServers(); },
    getLanServers:  function() { return getVisibleLanServers(); },
    saveServers:    function() { saveServers(SERVERS); },
    refreshList:    function() { refreshListUI(); updateButtonState(null); },

    removeServer: function(s) {
      if (!s || s.type === 'lan') return;
      var idx = SERVERS.indexOf(s);
      if (idx >= 0) SERVERS.splice(idx, 1);
      saveServers(SERVERS);
      refreshListUI();
      updateButtonState(null);
    },

    addServer: function(s) {
      applyPresetToServer(s);
      var firstLanIdx = -1;
      for (var i = 0; i < SERVERS.length; i++) {
        if (SERVERS[i].type === 'lan') { firstLanIdx = i; break; }
      }
      if (firstLanIdx >= 0) SERVERS.splice(firstLanIdx, 0, s);
      else SERVERS.push(s);
      saveServers(SERVERS);
      refreshListUI();
      updateButtonState(null);
    },

    joinServer: function(server) { joinServerFromList(server); },

    editServer: function(server) {
      console.log('[multiplayer] edit', server.name);
    }
  };

  /* ==========================================================
     处理 Direct Join —— 从 direct_join.html 通过 localStorage 传回
     ========================================================== */
  (function handlePendingDirectJoin() {
    var raw = null;
    try {
      raw = localStorage.getItem('mc_direct_join');
      if (raw) localStorage.removeItem('mc_direct_join');
    } catch (e) {
      console.warn('[direct] 读取失败', e);
      return;
    }

    if (!raw) return;

    var info;
    try { info = JSON.parse(raw); } catch (e) { return; }
    if (!info || !info.addr) return;

    setTimeout(function() {
      var addr   = info.addr;
      var preset = (window.mcServerPresets || {})[info.preset];

      if (preset && typeof preset.onJoin === 'function') {
        /* 走连接页 */
        var qs = ['addr=' + encodeURIComponent(addr)];
        var stages = getStagesFor(preset);
        qs.push('stages=' + encodeURIComponent(encodeStages(stages)));
        var url = 'connecting.html?' + qs.join('&');

        if (window.mcBack && typeof window.mcBack.jump === 'function') {
          window.mcBack.jump(url);
        } else {
          location.href = url;
        }
        return;
      }

      showDisconnected(addr);
    }, 50);
  })();
(function checkConfirmResult() {
  var actionRaw = null;
  var result    = null;
  try {
    actionRaw = localStorage.getItem('mc_confirm_action');
    result    = localStorage.getItem('mc_confirm_result');
    localStorage.removeItem('mc_confirm_action');
    localStorage.removeItem('mc_confirm_result');
  } catch (e) { return; }

  if (!actionRaw || result !== 'yes') return;

  var action;
  try { action = JSON.parse(actionRaw); } catch (e) { return; }
  if (!action) return;

setTimeout(function() {
  if (action.type === 'deleteServer') {
    var id  = action.data && action.data.id;
    var sel = null;
    for (var i = 0; i < SERVERS.length; i++) {
      if (SERVERS[i] && SERVERS[i].id === id) { sel = SERVERS[i]; break; }
    }
    if (!sel) return;

    /* 有 onDelete handle → 由 handle 决定做什么（它可能自己再删 / 只是提示） */
    if (typeof sel.onDelete === 'function') {
      try { sel.onDelete.call(sel); return; }
      catch (e) { console.error('[multiplayer] onDelete', e); }
    }

    /* 无 handle → 默认从列表删除 */
    var idx = SERVERS.indexOf(sel);
    if (idx >= 0) SERVERS.splice(idx, 1);
    saveServers(SERVERS);
    refreshListUI();
    updateButtonState(null);
  }
}, 50);
})();
/* ==========================================================
   从 world_loading.html 返回后，执行 server.onJoin
   ========================================================== */
(function checkPendingJoin() {
  var raw = null;
  try {
    raw = localStorage.getItem('mc_pending_join');
    if (raw) localStorage.removeItem('mc_pending_join');
  } catch (e) { return; }

  if (!raw) return;

  var info;
  try { info = JSON.parse(raw); } catch (e) { return; }
  if (!info || info.type !== 'server') return;

  setTimeout(function() {
    var target = null;

    /* 1. 按 id 找 mc_servers */
    if (info.id) {
      for (var i = 0; i < SERVERS.length; i++) {
        if (SERVERS[i] && SERVERS[i].id === info.id) { target = SERVERS[i]; break; }
      }
    }

    /* 2. 按 addr 找 presets */
    if (!target && info.addr && window.mcMatchPreset) {
      var m = window.mcMatchPreset(info.addr);
      if (m && m.preset) target = m.preset;
    }

    /* 3. 按 addr 找 mc_servers */
    if (!target && info.addr) {
      var a1 = String(info.addr).toLowerCase();
      if (a1.indexOf(':') < 0) a1 += ':25565';
      for (var j = 0; j < SERVERS.length; j++) {
        var s = SERVERS[j];
        if (!s) continue;
        var a2 = String(s.ip || s.address || '').toLowerCase();
        if (a2.indexOf(':') < 0) a2 += ':25565';
        if (a2 === a1) { target = s; break; }
      }
    }

    if (!target) return;

    if (typeof target.onJoin === 'function') {
      try { target.onJoin.call(target); }
      catch (e) { console.error('[multiplayer] onJoin', e); }
    }
  }, 50);
})();
  /* ==========================================================
     启动
     ========================================================== */
  refreshServerList(true);

})();
</script>
