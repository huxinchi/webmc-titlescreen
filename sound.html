<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sound Options</title>

<link rel="preload" as="image" href="assets/background/panorama_equirect.png">
<link rel="preload" as="image" href="assets/background/panorama_0.png">
<link rel="preload" as="image" href="assets/background/panorama_1.png">
<link rel="preload" as="image" href="assets/background/panorama_2.png">
<link rel="preload" as="image" href="assets/background/panorama_3.png">
<link rel="preload" as="image" href="assets/background/panorama_4.png">
<link rel="preload" as="image" href="assets/background/panorama_5.png">
<link rel="preload" as="image" href="assets/background/menu_list_background.png">
<link rel="preload" as="audio" href="assets/sound/click.ogg">

<link rel="stylesheet" href="css/import.css">
<link rel="stylesheet" href="css/pano.css">
<link rel="stylesheet" href="css/options_screen.css">
<script src="js/font.js"></script>
</head>
<body>

<audio id="sfx-click" src="assets/sound/click.ogg" preload="auto"></audio>

<canvas id="pano-canvas"></canvas>
<div id="pano-css"></div>
<div id="pano-cover"></div>

<div class="options-screen">
  <div class="options-header">
    <div class="options-title" data-i18n="options.sounds.title">Sound Options</div>
  </div>
  <div class="options-content mc-scroll" id="opts-list"></div>
  <div class="options-footer">
    <a class="mcbtn mcbtn-long btn-back" href="options.html" data-i18n="gui.done">Done</a>
  </div>
</div>

<script src="js/main.js"></script>
<script>
(function() {
  'use strict';
  var listEl = document.getElementById('opts-list');
  if (!listEl || !window.mcWidgets || !window.mcWidgets.OptionsList) return;

  var OPTIONS = {
    'soundCategory.master':  { type: 'slider', min: 0, max: 1, step: 0.01, value: 1, format: 'percentOrOff' },

    'soundCategory.music':   { type: 'slider', min: 0, max: 1, step: 0.01, value: 1, format: 'percentOrOff' },
    'soundCategory.record':  { type: 'slider', min: 0, max: 1, step: 0.01, value: 1, format: 'percentOrOff' },
    'soundCategory.weather': { type: 'slider', min: 0, max: 1, step: 0.01, value: 1, format: 'percentOrOff' },
    'soundCategory.block':   { type: 'slider', min: 0, max: 1, step: 0.01, value: 1, format: 'percentOrOff' },
    'soundCategory.hostile': { type: 'slider', min: 0, max: 1, step: 0.01, value: 1, format: 'percentOrOff' },
    'soundCategory.neutral': { type: 'slider', min: 0, max: 1, step: 0.01, value: 1, format: 'percentOrOff' },
    'soundCategory.player':  { type: 'slider', min: 0, max: 1, step: 0.01, value: 1, format: 'percentOrOff' },
    'soundCategory.ambient': { type: 'slider', min: 0, max: 1, step: 0.01, value: 1, format: 'percentOrOff' },
    'soundCategory.voice':   { type: 'slider', min: 0, max: 1, step: 0.01, value: 1, format: 'percentOrOff' },
    'soundCategory.ui':      { type: 'slider', min: 0, max: 1, step: 0.01, value: 1, format: 'percentOrOff' },

    'options.audioDevice':      { type: 'enum', values: ['default'], value: 'default',
                                  valueKey: 'options.audioDevice.' },
    'options.showSubtitles':    { type: 'boolean', value: false },
    'options.directionalAudio': { type: 'boolean', value: false },

    'options.music_frequency':  { type: 'enum',
                                  values: ['default','rarely','sometimes','often','always'],
                                  value: 'default',
                                  valueKey: 'options.music_frequency.' },
    'options.musicToast':       { type: 'enum',
                                  values: ['never','once','always'],
                                  value: 'never',
                                  valueKey: 'options.musicToast.' }
  };

  var ROWS = [
    { big: 'soundCategory.master' },

    ['soundCategory.music',   'soundCategory.record'],
    ['soundCategory.weather', 'soundCategory.block'],
    ['soundCategory.hostile', 'soundCategory.neutral'],
    ['soundCategory.player',  'soundCategory.ambient'],
    ['soundCategory.voice',   'soundCategory.ui'],

    { big: 'options.audioDevice' },

    ['options.showSubtitles',  'options.directionalAudio'],
    ['options.music_frequency','options.musicToast']
  ];

  new window.mcWidgets.OptionsList(listEl, { options: OPTIONS, rows: ROWS });
})();
</script>

</body>
</html>
