<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Loading World</title>

<link rel="preload" as="image" href="assets/background/panorama_equirect.png">
<link rel="preload" as="image" href="assets/background/panorama_0.png">
<link rel="preload" as="image" href="assets/background/panorama_1.png">
<link rel="preload" as="image" href="assets/background/panorama_2.png">
<link rel="preload" as="image" href="assets/background/panorama_3.png">
<link rel="preload" as="image" href="assets/background/panorama_4.png">
<link rel="preload" as="image" href="assets/background/panorama_5.png">
<link rel="preload" as="audio" href="assets/sound/click.ogg">

<link rel="stylesheet" href="css/import.css">
<link rel="stylesheet" href="css/pano.css">
<script src="js/font.js"></script>

<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    color: #fff;
    font-family: 'Minecraft', monospace;
    -webkit-font-smoothing: none;
    font-smooth: never;
    position: relative;
  }

  #pano-cover { background: rgba(0, 0, 0, 0.35); }

  .ll-screen {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%) scale(var(--ui-scale, 1));
    transform-origin: top center;
    width:  calc(100vw / var(--ui-scale, 1));
    height: calc(100vh / var(--ui-scale, 1));
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }

  /* 区块图：17×17，每格 2×2，总 34×34 —— 屏幕正中 */
  .ll-chunkmap {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    image-rendering: pixelated;
    width: 34px;
    height: 34px;
  }

  /* 文字：textTop = yCenter - radius*2 - 9*3，居中水平 */
  .ll-text {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Minecraft', monospace;
    font-size: var(--font-size, 10px);
    line-height: 9px;
    color: #ffffff;
    text-shadow: 1px 1px 0 #3f3f3f;
    white-space: nowrap;
    text-align: center;
    user-select: none;
  }

  /* 进度条：200×2，位于 textTop + 12 */
  .ll-bar {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 2px;
    background: #000000;
    overflow: hidden;
  }
  .ll-bar-fill {
    height: 100%;
    width: 0%;
    background: #00ff00;
  }
</style>
</head>
<body>

<audio id="sfx-click" src="assets/sound/click.ogg" preload="auto"></audio>

<canvas id="pano-canvas"></canvas>
<div id="pano-css"></div>
<div id="pano-cover"></div>

<div class="ll-screen">
  <div class="ll-text" id="ll-text">Loading terrain...</div>
  <canvas class="ll-chunkmap" id="ll-chunkmap" width="34" height="34"></canvas>
  <div class="ll-bar"><div class="ll-bar-fill" id="ll-bar-fill"></div></div>
</div>

<script src="js/main.js"></script>
<script src="js/show_background.js"></script>

<script>
(function() {
  'use strict';

  /* ==========================================================
     ChunkStatus 枚举 —— 全局挂出，供 onLoading 引用
     ========================================================== */
  window.mcChunkStatus = {
    EMPTY:                0,
    STRUCTURE_STARTS:     1,
    STRUCTURE_REFERENCES: 2,
    BIOMES:               3,
    NOISE:                4,
    SURFACE:              5,
    CARVERS:              6,
    FEATURES:             7,
    INITIALIZE_LIGHT:     8,
    LIGHT:                9,
    SPAWN:                10,
    FULL:                 11
  };

  /* 颜色（对齐 LevelLoadingScreen.COLORS） */
  var STATUS_COLORS = [
    '#545454',  // EMPTY
    '#999999',  // STRUCTURE_STARTS
    '#5F6191',  // STRUCTURE_REFERENCES
    '#80B252',  // BIOMES
    '#D1D1D1',  // NOISE
    '#726809',  // SURFACE
    '#303572',  // CARVERS
    '#21C600',  // FEATURES
    '#CCCCCC',  // INITIALIZE_LIGHT
    '#FFE0A0',  // LIGHT
    '#F26060',  // SPAWN
    '#FFFFFF'   // FULL
  ];

  /* 布局常量 */
  var RADIUS   = 8;
  var DIAMETER = RADIUS * 2 + 1;         // 17
  var CELL     = 2;
  var TOTAL    = DIAMETER * CELL;        // 34
  var COUNT    = DIAMETER * DIAMETER;    // 289

  /* ==========================================================
     参数
       ?folder=<name>   从 mc_worlds 按 folder 匹配
       ?sid=<id>        从 mc_servers 按 id 匹配
       ?addr=<addr>     从 presets 或 mc_servers 按 addr 匹配
       ?return=<url>    结束时跳回（栈空时兜底，默认 sstart.html）
     ========================================================== */
  var params    = new URLSearchParams(location.search);
  var P_FOLDER  = params.get('folder') || '';
  var P_SID     = params.get('sid')    || '';
  var P_ADDR    = params.get('addr')   || '';
  var RETURN_URL = params.get('return') || 'sstart.html';

  /* ==========================================================
     i18n
     ========================================================== */
  var FALLBACKS = {
    'multiplayer.downloadingTerrain': 'Loading terrain...',
    'narrator.ready_to_play':         'Ready to play!'
  };
  function t(key) {
    var v = (window.i18n && window.i18n.t) ? window.i18n.t(key) : key;
    if (v === key && FALLBACKS[key] != null) return FALLBACKS[key];
    return v;
  }

  /* ==========================================================
     DOM
     ========================================================== */
  var textEl   = document.getElementById('ll-text');
  var canvasEl = document.getElementById('ll-chunkmap');
  var barEl    = document.querySelector('.ll-bar');
  var barFillEl = document.getElementById('ll-bar-fill');
  var ctx      = canvasEl.getContext('2d');
  canvasEl.width  = TOTAL;
  canvasEl.height = TOTAL;

  textEl.textContent = t('multiplayer.downloadingTerrain');
  document.addEventListener('i18n-ready', function() {
    textEl.textContent = t('multiplayer.downloadingTerrain');
  }, false);

  function layout() {
    var scale = parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--ui-scale')
    ) || 1;
    var logicalH = window.innerHeight / scale;
    var yCenter  = logicalH / 2;

    /* textTop = yCenter - radius*2 - 9*3 */
    var textTop = yCenter - RADIUS * 2 - 9 * 3;
    textEl.style.top = textTop + 'px';

    /* 进度条：textTop + 9 + 3 */
    barEl.style.top = (textTop + 12) + 'px';
  }
  layout();
  window.addEventListener('resize', layout);

  /* ==========================================================
     渲染一帧区块图
     statuses: 长度 289 的数组，索引 = dy*17 + dx
     ========================================================== */
  function renderChunkMap(statuses) {
    for (var i = 0; i < COUNT; i++) {
      var status = statuses[i] || 0;
      var color = STATUS_COLORS[status] || '#000000';
      var x = (i % DIAMETER) * CELL;
      var y = Math.floor(i / DIAMETER) * CELL;
      ctx.fillStyle = color;
      ctx.fillRect(x, y, CELL, CELL);
    }
  }

  /* 进度 = 已 FULL 的区块数 / 总数 */
  function computeProgress(statuses) {
    var full = 0;
    for (var i = 0; i < COUNT; i++) {
      if (statuses[i] === window.mcChunkStatus.FULL) full++;
    }
    return full / COUNT;
  }

  function renderProgress(statuses) {
    var p = computeProgress(statuses);
    barFillEl.style.width = Math.round(p * 200) + 'px';
  }

  /* ==========================================================
     反序列化 + 目标查找
     ========================================================== */
  var FN_KEY = '__fn__';

  function deserialize(obj) {
    if (Array.isArray(obj)) return obj.map(deserialize);
    if (!obj || typeof obj !== 'object') return obj;
    var out = {};
    for (var k in obj) {
      var v = obj[k];
      if (v && typeof v === 'object' && typeof v[FN_KEY] === 'string') {
        try { out[k] = new Function('return (' + v[FN_KEY] + ')')(); }
        catch (e) {}
      } else if (v && typeof v === 'object') {
        out[k] = deserialize(v);
      } else {
        out[k] = v;
      }
    }
    return out;
  }

  function findInStore(key, match) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return null;
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return null;
      for (var i = 0; i < arr.length; i++) {
        if (arr[i] && match(arr[i])) return deserialize(arr[i]);
      }
    } catch (e) {}
    return null;
  }

  function normAddr(a) {
    a = String(a || '').trim().toLowerCase();
    if (!a) return '';
    if (a.indexOf(':') < 0) a += ':25565';
    return a;
  }

  function findTarget() {
    /* 1. folder → mc_worlds */
    if (P_FOLDER) {
      var w = findInStore('mc_worlds', function(x) { return x.folder === P_FOLDER; });
      if (w) return w;
    }
    /* 2. sid → mc_servers */
    if (P_SID) {
      var s = findInStore('mc_servers', function(x) { return x.id === P_SID; });
      if (s) return s;
    }
    /* 3. addr → presets 或 mc_servers */
    if (P_ADDR) {
      var m = window.mcMatchPreset ? window.mcMatchPreset(P_ADDR) : null;
      if (m && m.preset) return m.preset;
      var a1 = normAddr(P_ADDR);
      var s2 = findInStore('mc_servers', function(x) {
        return normAddr(x.ip || x.address || '') === a1;
      });
      if (s2) return s2;
    }
    return null;
  }

  /* ==========================================================
     完成 / 返回
     ========================================================== */
  var done = false;
  var timer = null;

  function finish() {
    if (done) return;
    done = true;
    if (timer) { clearInterval(timer); timer = null; }

    try {
      if (window.mcNarrator && window.mcNarrator.speak) {
        window.mcNarrator.speak(t('narrator.ready_to_play'));
      }
    } catch (e) {}

    if (window.mcBack && typeof window.mcBack.back === 'function') {
      window.mcBack.back(RETURN_URL);
    } else {
      location.href = RETURN_URL;
    }
  }

  /* ==========================================================
     主流程
     ========================================================== */
  function run() {
    var target = findTarget();

    /* 找不到 target 或无 onLoading → 立即完成，不显示加载过程 */
    if (!target || typeof target.onLoading !== 'function') {
      finish();
      return;
    }

    /* 初始化 statuses：全 EMPTY */
    var statuses = new Array(COUNT);
    for (var i = 0; i < COUNT; i++) statuses[i] = window.mcChunkStatus.EMPTY;

    var frame    = 0;
    var interval = (typeof target.loadingInterval === 'number' && target.loadingInterval > 0)
      ? target.loadingInterval
      : 50;

    /* 先渲染初始一帧 */
    renderChunkMap(statuses);
    renderProgress(statuses);

    timer = setInterval(function() {
      var result;
      try {
        result = target.onLoading(statuses, frame);
      } catch (e) {
        console.error('[world_loading] onLoading error:', e);
        finish();
        return;
      }

      /* 返回 null / undefined → 完成 */
      if (result === null || result === undefined) {
        finish();
        return;
      }

      /* 返回数组 → 渲染 */
      if (Array.isArray(result) && result.length === COUNT) {
        statuses = result;
        renderChunkMap(statuses);
        renderProgress(statuses);
      }

      frame++;
    }, interval);
  }

  /* ==========================================================
     Esc 拦截（shouldCloseOnEsc = false）
     ========================================================== */
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

  /* ==========================================================
     启动
     ========================================================== */
  if (window.i18n && window.i18n.ready) {
    window.i18n.ready(run);
  } else {
    run();
  }

})();
</script>

</body>
</html>
