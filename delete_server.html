<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Confirm</title>

<link rel="preload" as="image" href="assets/background/panorama_equirect.png">
<link rel="preload" as="image" href="assets/background/panorama_0.png">
<link rel="preload" as="image" href="assets/background/panorama_1.png">
<link rel="preload" as="image" href="assets/background/panorama_2.png">
<link rel="preload" as="image" href="assets/background/panorama_3.png">
<link rel="preload" as="image" href="assets/background/panorama_4.png">
<link rel="preload" as="image" href="assets/background/panorama_5.png">
<link rel="preload" as="audio" href="assets/sound/click.ogg">

<link rel="stylesheet" href="css/import.css">
<link rel="stylesheet" href="css/pano.css">
<script src="js/font.js"></script>

<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    color: #fff;
    font-family: 'Minecraft', monospace;
    -webkit-font-smoothing: none;
    font-smooth: never;
    position: relative;
  }

  .confirm-screen {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%) scale(var(--ui-scale, 1));
    transform-origin: top center;
    width:  calc(100vw / var(--ui-scale, 1));
    height: calc(100vh / var(--ui-scale, 1));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    z-index: 1;
    overflow: hidden;
  }

  .confirm-box {
    width: calc(100% - 50px);
    max-width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    box-sizing: border-box;
  }

  .confirm-title {
    font-family: 'Minecraft', monospace;
    font-size: var(--font-size, 10px);
    font-weight: bold;
    color: #ffffff;
    text-shadow: 1px 1px 0 #3f3f3f;
    text-align: center;
    user-select: none;
  }

  .confirm-message {
    max-width: 100%;
    font-family: 'Minecraft', monospace;
    font-size: var(--font-size, 10px);
    color: #BABABE;
    text-shadow: 1px 1px 0 #1a1a1a;
    line-height: 1.5;
    text-align: center;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    box-sizing: border-box;
  }

  .confirm-buttons {
    display: flex;
    gap: 4px;
    justify-content: center;
    padding-top: 16px;
  }
</style>
</head>
<body>

<audio id="sfx-click" src="assets/sound/click.ogg" preload="auto"></audio>

<canvas id="pano-canvas"></canvas>
<div id="pano-css"></div>
<div id="pano-cover"></div>

<div class="confirm-screen">
  <div class="confirm-box">

    <div class="confirm-title"   id="confirm-title"></div>
    <div class="confirm-message" id="confirm-message"></div>

    <div class="confirm-buttons">
      <a class="mcbtn mcbtn-150" id="btn-yes" href="#">Yes</a>
      <a class="mcbtn mcbtn-150" id="btn-no"  href="#">No</a>
    </div>

  </div>
</div>

<script src="js/main.js"></script>

<script>
(function() {
  'use strict';

  /* ==========================================================
     参数
       ?title=<encoded>     标题
       ?message=<encoded>   正文
       ?yes=<encoded>       Yes 按钮文字（缺省用 gui.yes）
       ?no=<encoded>        No 按钮文字（缺省用 gui.no）
     ========================================================== */
  var params = new URLSearchParams(location.search);

  function t(key, fallback) {
    var v = (window.i18n && window.i18n.t) ? window.i18n.t(key) : key;
    if (v === key && fallback != null) return fallback;
    return v;
  }

  var titleEl   = document.getElementById('confirm-title');
  var messageEl = document.getElementById('confirm-message');
  var yesEl     = document.getElementById('btn-yes');
  var noEl      = document.getElementById('btn-no');

  /* ==========================================================
     应用文本
     调用方已经算好所有文案并塞进 URL，本页只做展示
     ========================================================== */
  function apply() {
    var title   = params.get('title');
    var message = params.get('message');
    var yesText = params.get('yes');
    var noText  = params.get('no');

    titleEl.textContent = (title != null && title !== '')
      ? title
      : t('selectServer.deleteQuestion', 'Are you sure?');

    messageEl.textContent = (message != null) ? message : '';

    yesEl.textContent = (yesText != null && yesText !== '')
      ? yesText
      : t('gui.yes', 'Yes');

    noEl.textContent = (noText != null && noText !== '')
      ? noText
      : t('gui.no', 'No');
  }

  apply();
  document.addEventListener('i18n-ready', apply, false);

  /* ==========================================================
     结果写回 localStorage
       调用方页面负责在加载时读 mc_confirm_result 并执行动作
     ========================================================== */
function setResult(value) {
  try {
    localStorage.setItem('mc_confirm_result', value);
  } catch (e) {}
}

  /* ==========================================================
     返回上一页
     - fromurl 栈非空 → 弹栈回去（调用方页面）
     - 栈空          → fallback index.html
     ========================================================== */
  function goBack() {
    if (window.mcBack && typeof window.mcBack.back === 'function') {
      window.mcBack.back('index.html');
    } else {
      location.href = 'index.html';
    }
  }

  /* ==========================================================
     Yes / No
     ========================================================== */
  yesEl.addEventListener('click', function(e) {
    e.preventDefault();
    setResult('yes');
    goBack();
  });

  noEl.addEventListener('click', function(e) {
    e.preventDefault();
    setResult('no');
    goBack();
  });

  /* ==========================================================
     Esc = No（对齐原版 ConfirmScreen.keyPressed）
     ========================================================== */
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      noEl.click();
    }
  }, true);

})();
</script>

</body>
</html>
