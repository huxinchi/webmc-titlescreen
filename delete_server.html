<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Delete Server</title>

<link rel="preload" as="image" href="assets/background/panorama_equirect.png">
<link rel="preload" as="image" href="assets/background/panorama_0.png">
<link rel="preload" as="image" href="assets/background/panorama_1.png">
<link rel="preload" as="image" href="assets/background/panorama_2.png">
<link rel="preload" as="image" href="assets/background/panorama_3.png">
<link rel="preload" as="image" href="assets/background/panorama_4.png">
<link rel="preload" as="image" href="assets/background/panorama_5.png">
<link rel="preload" as="audio" href="assets/sound/click.ogg">

<link rel="stylesheet" href="css/import.css">
<link rel="stylesheet" href="css/pano.css">
<script src="js/font.js"></script>

<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
  }
  body {
    color: #fff;
    font-family: 'Minecraft', monospace;
    -webkit-font-smoothing: none;
    font-smooth: never;
    position: relative;
  }

  /* 对应 FrameLayout.centerInRectangle(this.layout, getRectangle()) */
  .confirm-screen {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%) scale(var(--ui-scale, 1));
    transform-origin: top center;
    width:  calc(100vw / var(--ui-scale, 1));
    height: calc(100vh / var(--ui-scale, 1));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    z-index: 1;
    overflow: hidden;
  }

  /* LinearLayout.vertical().spacing(8) */
  .confirm-box {
    width: calc(100% - 50px);   /* 对齐 message maxWidth = width - 50 */
    max-width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    box-sizing: border-box;
  }

  /* StringWidget(title) */
  .confirm-title {
    font-family: 'Minecraft', monospace;
    font-size: var(--font-size, 10px);
    font-weight: bold;
    color: #ffffff;
    text-shadow: 1px 1px 0 #3f3f3f;
    text-align: center;
    user-select: none;
  }

  /* MultiLineTextWidget(message).setMaxWidth(width-50).setCentered(true) */
  .confirm-message {
    max-width: 100%;
    font-family: 'Minecraft', monospace;
    font-size: var(--font-size, 10px);
    color: #BABABE;
    text-shadow: 1px 1px 0 #1a1a1a;
    line-height: 1.5;
    text-align: center;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    box-sizing: border-box;
  }

  /* LinearLayout.horizontal().spacing(4) + paddingTop(16) */
  .confirm-buttons {
    display: flex;
    gap: 4px;
    justify-content: center;
    padding-top: 16px;
  }
</style>
</head>
<body>

<audio id="sfx-click" src="assets/sound/click.ogg" preload="auto"></audio>

<canvas id="pano-canvas"></canvas>
<div id="pano-css"></div>
<div id="pano-cover"></div>

<div class="confirm-screen">
  <div class="confirm-box">

    <div class="confirm-title" id="confirm-title">Are you sure you want to remove this server?</div>

    <div class="confirm-message" id="confirm-message"></div>

    <div class="confirm-buttons">
      <a class="mcbtn mcbtn-150" id="btn-yes" href="#">Delete</a>
      <a class="mcbtn mcbtn-150" id="btn-no"  href="#">Cancel</a>
    </div>

  </div>
</div>

<script src="js/main.js"></script>

<script>
(function() {
  'use strict';

  var STORAGE_KEY = 'mc_servers';

  /* ==========================================================
     参数：?id=服务器 id
     ========================================================== */
  var params   = new URLSearchParams(location.search);
  var serverId = params.get('id') || '';

  function t(key, fallback) {
    var v = (window.i18n && window.i18n.t) ? window.i18n.t(key) : key;
    return v === key ? (fallback != null ? fallback : key) : v;
  }

  /* ==========================================================
     从 localStorage 读该 id 的服务器名
     ========================================================== */
  function findServerName(id) {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return '';
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return '';
      for (var i = 0; i < arr.length; i++) {
        if (arr[i] && arr[i].id === id) {
          return arr[i].name || arr[i].ip || '';
        }
      }
    } catch (e) {}
    return '';
  }

  /* ==========================================================
     从 localStorage 删除该 id 的条目
     ========================================================== */
  function removeServer(id) {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return;
      var out = arr.filter(function(s) {
        return !s || s.id !== id;
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(out));
    } catch (e) {}
  }

  /* ==========================================================
     DOM 引用
     ========================================================== */
  var titleEl   = document.getElementById('confirm-title');
  var messageEl = document.getElementById('confirm-message');
  var yesEl     = document.getElementById('btn-yes');
  var noEl      = document.getElementById('btn-no');

  var serverName = findServerName(serverId);

  /* ==========================================================
     应用文本（i18n 就绪前后各跑一次）
     key 取自原版 Minecraft：
       selectServer.deleteQuestion — 标题
       selectServer.deleteWarning  — 消息（含 %s 占位）
       selectServer.deleteButton   — Yes
       gui.cancel                  — No
     如果语言文件里缺 key，会回落到 fallback
     ========================================================== */
  function apply() {
    titleEl.textContent = t(
      'selectServer.deleteQuestion',
      'Are you sure you want to remove this server?'
    );

    var warnTpl = t(
      'selectServer.deleteWarning',
      "'%s' will be lost forever! (A long time!)"
    );
    messageEl.textContent = warnTpl.indexOf('%s') >= 0
      ? warnTpl.replace('%s', serverName)
      : warnTpl;

    yesEl.textContent = t('selectServer.deleteButton', t('gui.yes', 'Yes'));
    noEl.textContent  = t('gui.cancel', t('gui.no', 'No'));
  }

  apply();
  document.addEventListener('i18n-ready', apply, false);

  /* ==========================================================
     返回上一页
     - 栈里有上一页 → 弹栈回去（multiplayer）
     - 栈为空       → fallback 到 multiplayer.html
     ========================================================== */
  function goBack() {
    if (window.mcBack && typeof window.mcBack.back === 'function') {
      window.mcBack.back('multiplayer.html');
    } else {
      location.href = 'multiplayer.html';
    }
  }

  /* ==========================================================
     Yes → callback.accept(true)：删除 + 返回
     ========================================================== */
  yesEl.addEventListener('click', function(e) {
    e.preventDefault();
    removeServer(serverId);
    goBack();
  });

  /* ==========================================================
     No → callback.accept(false)：直接返回
     ========================================================== */
  noEl.addEventListener('click', function(e) {
    e.preventDefault();
    goBack();
  });

  /* ==========================================================
     Esc → 等价于 No（对齐 ConfirmScreen.keyPressed）
     ========================================================== */
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      noEl.click();
    }
  }, true);

})();
</script>

</body>
</html>
